name: CI

# Runs on pull requests so `main` can require it before a merge, and on pushes
# to `main` so the branch's own status stays visible.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# A new push to the same branch makes the previous run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The job name is what you select as the required status check on `main`.
  # Renaming it silently detaches that rule, so leave it as "verify".
  verify:
    name: verify
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Reads the version from package.json's `packageManager` field, so CI and
      # a developer machine cannot drift apart.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Three separate steps so a red run names what broke instead of making
      # someone read the log to find out.
      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
