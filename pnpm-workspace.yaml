# pnpm blocks dependency build scripts until each is explicitly decided, and
# errors out on any it has no decision for. Every package here must therefore
# carry a deliberate true/false — an omission fails the install.
allowBuilds:
  # Ships prebuilt binaries for every platform we use; the script is a no-op.
  better-sqlite3: true
  esbuild: true
  vue-demi: true

  # Tailwind's optional file watcher, pulled in on Linux only (never installs
  # on macOS), which is why this surfaced in CI and not locally. Denied rather
  # than built: it exists to speed up `--watch`, CI never watches, and its
  # platform-specific prebuild packages cover the case where it is needed.
  '@parcel/watcher': false
