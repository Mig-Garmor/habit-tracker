allowBuilds:
  # Optional native watcher for sass's file watching; unrelated to the Neon
  # migration and not needed here or in CI, so its native build stays off.
  '@parcel/watcher': false
  esbuild: true
  vue-demi: true

# Stops pnpm from auto-resolving drizzle-orm's *unused* optional peers (notably
# better-sqlite3, a native module the migration to Neon Postgres exists to get
# rid of). @neondatabase/serverless and @electric-sql/pglite are unaffected —
# both are explicit dependencies in package.json, so they resolve regardless.
autoInstallPeers: false
